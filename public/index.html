<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevOpsHub Task Tracker</title>
  <style>
    :root { --bg:#f5f7fa; --card:#fff; --text:#1f2933; --muted:#6b7785; --accent:#2563eb; --border:#e3e8ee; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12161c; --card:#1b212a; --text:#e6eaf0; --muted:#8b97a6; --accent:#60a5fa; --border:#2a323d; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
    main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .sub { color:var(--muted); margin:0 0 16px; font-size:.9rem; }
    form { display:flex; gap:8px; margin-bottom:16px; }
    input[type=text] { flex:1; padding:10px; border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--text); }
    button { padding:10px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
    button.ghost { background:transparent; color:var(--muted); padding:4px 8px; }
    ul { list-style:none; padding:0; margin:0; }
    li { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
    li span { flex:1; }
    li.done span { text-decoration: line-through; color:var(--muted); }
    footer { margin-top:16px; font-size:.8rem; color:var(--muted); text-align:center; }
    .empty { color:var(--muted); text-align:center; padding:16px 0; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>DevOpsHub Task Tracker</h1>
      <p class="sub">CI/CD pipeline ka demo web app</p>
      <form id="task-form">
        <input type="text" id="title" placeholder="Naya task likho..." autocomplete="off" required />
        <button type="submit">Add</button>
      </form>
      <ul id="task-list"></ul>
      <footer id="info">loading...</footer>
    </div>
  </main>

  <script>
    const list = document.getElementById('task-list');
    const form = document.getElementById('task-form');
    const titleInput = document.getElementById('title');

    async function load() {
      const tasks = await (await fetch('/api/tasks')).json();
      list.innerHTML = '';
      if (tasks.length === 0) {
        list.innerHTML = '<li class="empty">Abhi koi task nahi hai</li>';
        return;
      }
      for (const t of tasks) {
        const li = document.createElement('li');
        if (t.done) li.className = 'done';

        const check = document.createElement('input');
        check.type = 'checkbox';
        check.checked = t.done;
        check.addEventListener('change', async () => {
          await fetch('/api/tasks/' + t.id + '/toggle', { method: 'PUT' });
          load();
        });

        const text = document.createElement('span');
        text.textContent = t.title;

        const del = document.createElement('button');
        del.className = 'ghost';
        del.textContent = 'Delete';
        del.addEventListener('click', async () => {
          await fetch('/api/tasks/' + t.id, { method: 'DELETE' });
          load();
        });

        li.append(check, text, del);
        list.appendChild(li);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: titleInput.value }),
      });
      titleInput.value = '';
      load();
    });

    fetch('/health').then((r) => r.json()).then((h) => {
      document.getElementById('info').textContent = 'env: ' + h.env + ' | version: ' + h.version;
    });

    load();
  </script>
</body>
</html>
