# Ek hi compose file local (build) aur server (pre-built image) dono ke liye.
#   Local : docker compose up -d --build
#   Server: docker compose pull && docker compose up -d --no-build
services:
  devopshub-app:
    image: ${IMAGE:-devopshub-app:local}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_VERSION=${APP_VERSION:-local}
      - PORT=3000
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROM_PORT:-9090}:9090"
    depends_on:
      - devopshub-app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
