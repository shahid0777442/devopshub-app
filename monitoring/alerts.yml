groups:
  - name: devopshub-app-alerts
    rules:
      - alert: DevOpsHubAppDown
        expr: up{job="devopshub-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "DevOpsHub app down hai"
          description: "Prometheus 1 minute se app ko scrape nahi kar pa raha."

      - alert: DevOpsHubHighErrorRate
        expr: sum(rate(devopshub_http_requests_total{status=~"5.."}[5m])) / sum(rate(devopshub_http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "5xx error rate 5% se zyada hai"

      - alert: DevOpsHubSlowRequests
        expr: histogram_quantile(0.95, sum(rate(devopshub_http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency 1 second se zyada hai"
